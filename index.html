<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chocolavi · Controle de Estoque</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1B0F09;
    --bg-alt:#150A05;
    --surface:#271609;
    --surface-2:#331D0E;
    --border:#4A3220;
    --border-soft:#3A2716;
    --gold:#CFA24E;
    --gold-soft:#8A6B33;
    --pink:#DE9BAE;
    --pink-deep:#B96F87;
    --red:#C1544A;
    --red-soft:#3A211C;
    --green:#8FAE68;
    --green-soft:#243120;
    --text:#F4E9DA;
    --text-muted:#B39C86;
    --text-faint:#7A6653;
    --font-display:'Fraunces', serif;
    --font-body:'Manrope', sans-serif;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(207,162,78,0.10), transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 0%, rgba(222,155,174,0.07), transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--gold); color:#1B0F09;}
  ::-webkit-scrollbar{width:10px; height:10px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:var(--border); border-radius:8px;}

  /* ---------- layout shell ---------- */
  .shell{max-width:1180px; margin:0 auto; padding:28px 24px 80px;}

  header.top{
    display:flex; align-items:flex-end; justify-content:space-between; gap:20px;
    padding-bottom:22px; margin-bottom:8px; flex-wrap:wrap;
  }
  .brand{display:flex; align-items:center; gap:14px;}
  .brand-mark{
    width:46px; height:46px; border-radius:50%;
    background:conic-gradient(from 220deg, var(--gold), var(--pink), var(--gold-soft), var(--gold));
    display:flex; align-items:center; justify-content:center;
    box-shadow: inset 0 0 0 3px var(--bg), 0 0 0 1px var(--border-soft);
    flex-shrink:0;
  }
  .brand-mark svg{width:22px; height:22px;}
  .brand h1{
    font-family:var(--font-display); font-weight:600; font-size:26px; letter-spacing:0.01em;
    margin:0; color:var(--text);
  }
  .brand p{margin:2px 0 0; font-size:12.5px; color:var(--text-muted); letter-spacing:0.04em; text-transform:uppercase;}

  .drizzle{width:100%; height:10px; margin-bottom:26px; opacity:0.9;}

  nav.tabs{
    display:flex; gap:6px; flex-wrap:wrap; margin-bottom:28px;
    border-bottom:1px solid var(--border-soft); padding-bottom:0;
  }
  nav.tabs button{
    font-family:var(--font-body); font-weight:600; font-size:14px; color:var(--text-muted);
    background:none; border:none; cursor:pointer; padding:10px 16px; position:relative;
    display:flex; align-items:center; gap:8px; border-radius:10px 10px 0 0; transition:color .15s ease;
  }
  nav.tabs button:hover{color:var(--text);}
  nav.tabs button.active{color:var(--gold);}
  nav.tabs button.active::after{
    content:""; position:absolute; left:12px; right:12px; bottom:-1px; height:2px;
    background:linear-gradient(90deg, var(--gold), var(--pink));
    border-radius:2px;
  }
  nav.tabs .count{
    font-size:11px; font-weight:700; padding:1px 7px; border-radius:20px;
    background:var(--surface-2); color:var(--text-faint);
  }
  nav.tabs button.active .count{color:var(--gold); background:rgba(207,162,78,0.14);}
  nav.tabs .count.alert{background:var(--red-soft); color:#E8998C;}

  /* ---------- generic pieces ---------- */
  .panel{
    background:linear-gradient(180deg, var(--surface), var(--surface) 60%, var(--bg-alt));
    border:1px solid var(--border-soft); border-radius:var(--radius);
    padding:22px; margin-bottom:20px;
  }
  h2.section-title{
    font-family:var(--font-display); font-weight:600; font-size:19px; margin:0 0 14px;
    display:flex; align-items:center; gap:10px;
  }
  .muted{color:var(--text-muted);}
  .faint{color:var(--text-faint);}

  .stat-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:22px;}
  @media (max-width:820px){.stat-grid{grid-template-columns:repeat(2,1fr);}}
  .stat-card{
    background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius);
    padding:18px 18px 16px; position:relative; overflow:hidden;
  }
  .stat-card .label{font-size:11.5px; text-transform:uppercase; letter-spacing:0.06em; color:var(--text-faint); font-weight:700;}
  .stat-card .value{font-family:var(--font-display); font-size:30px; font-weight:600; margin-top:6px; color:var(--text);}
  .stat-card.warn .value{color:var(--red);}
  .stat-card .glow{
    position:absolute; width:90px; height:90px; border-radius:50%; right:-30px; top:-30px; opacity:0.16; filter:blur(6px);
    background:radial-gradient(circle, var(--gold), transparent 70%);
  }
  .stat-card.warn .glow{background:radial-gradient(circle, var(--red), transparent 70%);}

  table{width:100%; border-collapse:collapse; font-size:14px;}
  thead th{
    text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:0.05em;
    color:var(--text-faint); font-weight:700; padding:0 10px 10px; border-bottom:1px solid var(--border-soft);
  }
  tbody td{padding:12px 10px; border-bottom:1px solid rgba(74,50,32,0.35); vertical-align:middle;}
  tbody tr:hover{background:rgba(207,162,78,0.04);}
  tbody tr:last-child td{border-bottom:none;}
  td.num, th.num{text-align:right;}

  .item-name{font-weight:700; color:var(--text);}
  .item-sub{display:block; font-size:12px; color:var(--text-faint); font-weight:500; margin-top:1px;}

  .pill{
    display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:700;
    padding:3px 10px; border-radius:20px;
  }
  .pill.ok{background:var(--green-soft); color:#B7CC98;}
  .pill.low{background:var(--red-soft); color:#E8998C;}
  .pill.dot{width:6px; height:6px; border-radius:50%; background:currentColor; display:inline-block;}

  .btn{
    font-family:var(--font-body); font-weight:700; font-size:13px; cursor:pointer;
    border-radius:9px; border:1px solid var(--border); padding:8px 14px;
    background:var(--surface-2); color:var(--text); transition:all .15s ease; display:inline-flex; align-items:center; gap:6px;
  }
  .btn:hover{border-color:var(--gold-soft); color:var(--gold);}
  .btn.primary{background:linear-gradient(180deg, var(--gold), #B78A3C); color:#22140A; border-color:transparent;}
  .btn.primary:hover{filter:brightness(1.08); color:#22140A;}
  .btn.ghost{background:none; border-color:transparent; color:var(--text-muted); padding:8px 10px;}
  .btn.ghost:hover{color:var(--gold); background:var(--surface-2);}
  .btn.danger:hover{border-color:var(--red); color:var(--red);}
  .btn.sm{padding:5px 10px; font-size:12px; border-radius:7px;}
  .btn.icon{padding:6px 8px; line-height:0;}
  .btn:disabled{opacity:0.35; cursor:not-allowed;}

  .btn-row{display:flex; gap:6px; justify-content:flex-end;}

  .toolbar{display:flex; align-items:center; justify-content:space-between; gap:14px; margin-bottom:18px; flex-wrap:wrap;}
  .search{
    flex:1; min-width:200px; position:relative;
  }
  .search input{
    width:100%; background:var(--surface-2); border:1px solid var(--border-soft); border-radius:10px;
    padding:10px 14px 10px 36px; color:var(--text); font-family:var(--font-body); font-size:14px;
  }
  .search input:focus{outline:none; border-color:var(--gold-soft);}
  .search svg{position:absolute; left:12px; top:50%; transform:translateY(-50%); opacity:0.5;}
  .search input::placeholder{color:var(--text-faint);}

  .empty{
    text-align:center; padding:50px 20px; color:var(--text-faint);
  }
  .empty svg{opacity:0.35; margin-bottom:10px;}
  .empty .big{font-family:var(--font-display); font-size:17px; color:var(--text-muted); margin-bottom:4px;}

  /* ---------- modal ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(9,5,2,0.68); backdrop-filter:blur(3px);
    display:flex; align-items:center; justify-content:center; z-index:100; padding:20px;
    animation:fadeIn .15s ease;
  }
  @keyframes fadeIn{from{opacity:0} to{opacity:1}}
  .modal{
    background:linear-gradient(180deg, #2C1A0C, #21130A); border:1px solid var(--border);
    border-radius:16px; width:100%; max-width:440px; padding:24px; max-height:88vh; overflow-y:auto;
    box-shadow:0 20px 60px rgba(0,0,0,0.5);
  }
  .modal h3{font-family:var(--font-display); font-size:19px; margin:0 0 4px; font-weight:600;}
  .modal .modal-sub{font-size:13px; color:var(--text-muted); margin:0 0 18px;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12px; font-weight:700; color:var(--text-muted); margin-bottom:6px; text-transform:uppercase; letter-spacing:0.03em;}
  .field input, .field select, .field textarea{
    width:100%; background:var(--surface-2); border:1px solid var(--border-soft); border-radius:9px;
    padding:10px 12px; color:var(--text); font-family:var(--font-body); font-size:14px;
  }
  .field input:focus, .field select:focus, .field textarea:focus{outline:none; border-color:var(--gold-soft);}
  .field-row{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .modal-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:20px;}
  .seg{display:flex; background:var(--surface-2); border:1px solid var(--border-soft); border-radius:9px; padding:3px; gap:3px;}
  .seg button{flex:1; background:none; border:none; color:var(--text-muted); font-family:var(--font-body); font-weight:700; font-size:13px; padding:8px; border-radius:6px; cursor:pointer;}
  .seg button.active{background:var(--gold); color:#22140A;}
  .seg button.active.out{background:var(--red);}
  .hint{font-size:12px; color:var(--text-faint); margin-top:4px;}

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
    background:var(--surface-2); border:1px solid var(--gold-soft); color:var(--text);
    padding:11px 20px; border-radius:10px; font-size:13.5px; font-weight:600; z-index:200;
    box-shadow:0 10px 30px rgba(0,0,0,0.4); display:flex; align-items:center; gap:8px;
    animation:toastIn .2s ease;
  }
  @keyframes toastIn{from{opacity:0; transform:translate(-50%,8px)} to{opacity:1; transform:translate(-50%,0)}}

  .movement-row{display:flex; align-items:center; gap:12px; padding:12px 4px; border-bottom:1px solid rgba(74,50,32,0.35);}
  .movement-row:last-child{border-bottom:none;}
  .move-icon{width:34px; height:34px; border-radius:9px; display:flex; align-items:center; justify-content:center; flex-shrink:0; font-weight:800; font-size:15px;}
  .move-icon.in{background:var(--green-soft); color:#B7CC98;}
  .move-icon.out{background:var(--red-soft); color:#E8998C;}
  .move-body{flex:1; min-width:0;}
  .move-title{font-size:13.5px; font-weight:700; color:var(--text);}
  .move-meta{font-size:12px; color:var(--text-faint); margin-top:1px;}
  .move-qty{font-family:var(--font-display); font-weight:600; font-size:15px; white-space:nowrap;}
  .move-qty.in{color:#B7CC98;}
  .move-qty.out{color:#E8998C;}

  .low-list{display:flex; flex-direction:column; gap:0;}
  .low-item{display:flex; align-items:center; justify-content:space-between; padding:11px 4px; border-bottom:1px solid rgba(74,50,32,0.35); gap:10px;}
  .low-item:last-child{border-bottom:none;}

  footer.foot{text-align:center; margin-top:36px; color:var(--text-faint); font-size:12px;}
  footer.foot span{color:var(--gold-soft);}

  @media (max-width:640px){
    .field-row{grid-template-columns:1fr;}
    .stat-grid{grid-template-columns:1fr 1fr;}
    table{font-size:12.5px;}
    thead th, tbody td{padding:9px 6px;}
  }
</style>
</head>

<script>
(function(){
"use strict";

/* ---------------- seed data (from planilha) ---------------- */
const SEED_INGREDIENTES = JSON.parse(document.getElementById('seed-ingredientes').textContent);
const SEED_EMBALAGENS   = JSON.parse(document.getElementById('seed-embalagens').textContent);
const SEED_PRODUTOS     = JSON.parse(document.getElementById('seed-produtos').textContent);

function uid(){ return 'id-' + Math.random().toString(36).slice(2,10) + Date.now().toString(36); }

function buildSeedItems(){
  const items = [];
  SEED_INGREDIENTES.forEach(i=>{
    items.push({
      id: uid(), nome: i.nome, categoria:'Ingrediente', unidade:i.unidade,
      embalagem_qtd:i.embalagem_qtd, custo_embalagem:i.custo_embalagem,
      custo_unitario: Math.round((i.custo_embalagem/i.embalagem_qtd)*10000)/10000,
      estoque_atual:0, estoque_minimo:i.embalagem_qtd
    });
  });
  SEED_EMBALAGENS.forEach(e=>{
    items.push({
      id: uid(), nome:e.nome, categoria:'Embalagem', unidade:e.unidade,
      embalagem_qtd:e.embalagem_qtd, custo_embalagem:e.custo_embalagem,
      custo_unitario: Math.round((e.custo_embalagem/e.embalagem_qtd)*10000)/10000,
      estoque_atual:0, estoque_minimo: Math.max(5, Math.round(e.embalagem_qtd*0.2))
    });
  });
  SEED_PRODUTOS.forEach(p=>{
    items.push({
      id: uid(), nome:p.nome, categoria:'Produto Pronto', unidade:'un', subcategoria:p.categoria,
      custo_unitario:p.custo_unitario, preco_venda:p.preco_venda,
      estoque_atual:0, estoque_minimo:5
    });
  });
  return items;
}

/* ---------------- state ---------------- */
let STATE = { items:[], movements:[] };
let ui = { tab:'painel', search:'', modalItem:null, modalMove:null, editingId:null };
const STORAGE_KEY = 'chocolavi-estoque-v1';

/* ---------------- persistence ---------------- */
async function loadState(){
  try{
    const res = await window.storage.get(STORAGE_KEY, false);
    if(res && res.value){
      STATE = JSON.parse(res.value);
      return;
    }
  }catch(e){ /* not found yet */ }
  STATE = { items: buildSeedItems(), movements: [] };
  await saveState();
}
async function saveState(){
  try{
    await window.storage.set(STORAGE_KEY, JSON.stringify(STATE), false);
  }catch(e){
    console.error('Erro ao salvar', e);
    toast('Não foi possível salvar. Tente novamente.');
  }
}

/* ---------------- helpers ---------------- */
function fmtMoney(v){
  if(v===undefined||v===null||isNaN(v)) return '—';
  return 'R$ ' + Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2, maximumFractionDigits:2});
}
function fmtQty(v, unidade){
  const n = Number(v)||0;
  const s = n.toLocaleString('pt-BR', {maximumFractionDigits:2});
  return s + ' ' + (unidade||'un');
}
function fmtDate(iso){
  const d = new Date(iso);
  return d.toLocaleDateString('pt-BR') + ' · ' + d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
}
function isLow(item){ return Number(item.estoque_atual) <= Number(item.estoque_minimo); }
function itemsByCat(cat){
  return STATE.items.filter(i=>i.categoria===cat).sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR'));
}
function filterSearch(list){
  if(!ui.search.trim()) return list;
  const q = ui.search.trim().toLowerCase();
  return list.filter(i=> i.nome.toLowerCase().includes(q) || (i.subcategoria||'').toLowerCase().includes(q));
}
function totalValue(cat){
  return STATE.items.filter(i=> !cat || i.categoria===cat)
    .reduce((sum,i)=> sum + (Number(i.estoque_atual)||0) * (Number(i.custo_unitario)||0), 0);
}
function lowCount(cat){
  return STATE.items.filter(i=> (!cat || i.categoria===cat) && isLow(i)).length;
}

let toastTimer=null;
function toast(msg){
  let el = document.getElementById('toast');
  if(el) el.remove();
  el = document.createElement('div');
  el.id='toast'; el.className='toast';
  el.innerHTML = msg;
  document.body.appendChild(el);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ el.remove(); }, 2600);
}

};

const TAB_META = {
  painel: {label:'Painel', icon: ICONS.candy},
  Ingrediente: {label:'Ingredientes', icon: ICONS.wheat},
  Embalagem: {label:'Embalagens', icon: ICONS.gift},
  'Produto Pronto': {label:'Produtos', icon: ICONS.candy},
  movimentacoes: {label:'Movimentações', icon: ICONS.clock},
};

/* ---------------- render root ---------------- */
function render(){
  document.querySelectorAll('.overlay').forEach(el=> el.remove());
  const app = document.getElementById('app');
  app.innerHTML = `
    ${renderHeader()}
    ${renderDrizzle()}
    ${renderTabs()}
    <div id="tab-content">${renderTabContent()}</div>
    ${renderFooter()}
  `;
  bindGlobalEvents();
  if(ui.modalItem) renderItemModal();
  if(ui.modalMove) renderMoveModal();
}

function renderHeader(){
  return `
  <header class="top">
    <div class="brand">
      <div class="brand-mark">${ICONS.bean}</div>
      <div>
        <h1>Chocolavi</h1>
        <p>Controle de Estoque</p>
      </div>
    </div>
    <div class="muted" style="font-size:13px;">${new Date().toLocaleDateString('pt-BR',{weekday:'long', day:'2-digit', month:'long'})}</div>
  </header>`;
}

function renderDrizzle(){
  return `<svg class="drizzle" viewBox="0 0 1180 10" preserveAspectRatio="none">
    <path d="M0,5 C 100,0 200,10 300,5 C 400,0 500,10 600,5 C 700,0 800,10 900,5 C 1000,0 1100,10 1180,5"
      stroke="url(#g1)" stroke-width="2" fill="none" stroke-linecap="round"/>
    <defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#CFA24E"/><stop offset="50%" stop-color="#DE9BAE"/><stop offset="100%" stop-color="#CFA24E"/>
    </linearGradient></defs>
  </svg>`;
}

function renderTabs(){
  const order = ['painel','Ingrediente','Embalagem','Produto Pronto','movimentacoes'];
  return `<nav class="tabs">
    ${order.map(key=>{
      const meta = TAB_META[key];
      let countHtml = '';
      if(key==='painel'){
        const lc = lowCount();
        countHtml = lc>0 ? `<span class="count alert">${lc}</span>` : '';
      } else if(key==='movimentacoes'){
        countHtml = STATE.movements.length ? `<span class="count">${STATE.movements.length}</span>` : '';
      } else {
        const n = itemsByCat(key).length;
        const lc = lowCount(key);
        countHtml = lc>0 ? `<span class="count alert">${lc}</span>` : (n? `<span class="count">${n}</span>` : '');
      }
      return `<button data-tab="${key}" class="${ui.tab===key?'active':''}">${meta.icon}${meta.label}${countHtml}</button>`;
    }).join('')}
  </nav>`;
}

function renderFooter(){
  return `<footer class="foot">Feito com <span>♥</span> para a Chocolavi · dados salvos automaticamente neste dispositivo</footer>`;
}

function renderTabContent(){
  if(ui.tab==='painel') return renderPainel();
  if(ui.tab==='movimentacoes') return renderMovimentacoes();
  return renderCategoryTab(ui.tab);
}

/* ---------------- painel (dashboard) ---------------- */
function renderPainel(){
  const total = STATE.items.length;
  const low = lowCount();
  const val = totalValue();
  const recent = [...STATE.movements].sort((a,b)=> new Date(b.data)-new Date(a.data)).slice(0,6);
  const lowItems = STATE.items.filter(isLow).sort((a,b)=> (a.estoque_atual-a.estoque_minimo) - (b.estoque_atual-b.estoque_minimo)).slice(0,8);

  return `
  <div class="stat-grid">
    <div class="stat-card"><div class="glow"></div><div class="label">Itens cadastrados</div><div class="value">${total}</div></div>
    <div class="stat-card ${low>0?'warn':''}"><div class="glow"></div><div class="label">Estoque baixo</div><div class="value">${low}</div></div>
    <div class="stat-card"><div class="glow"></div><div class="label">Valor em estoque</div><div class="value" style="font-size:24px;">${fmtMoney(val)}</div></div>
    <div class="stat-card"><div class="glow"></div><div class="label">Movimentações</div><div class="value">${STATE.movements.length}</div></div>
  </div>

  <div style="display:grid; grid-template-columns:1.2fr 1fr; gap:20px;" class="painel-grid">
    <div class="panel">
      <h2 class="section-title">${ICONS.alert} Precisa repor</h2>
      ${lowItems.length ? `<div class="low-list">${lowItems.map(i=>`
        <div class="low-item">
          <div>
            <div class="item-name">${escapeHtml(i.nome)}</div>
            <div class="item-sub">${i.categoria} · atual: ${fmtQty(i.estoque_atual, i.unidade)} · mínimo: ${fmtQty(i.estoque_minimo, i.unidade)}</div>
          </div>
          <button class="btn sm primary" data-move-in="${i.id}">${ICONS.plus} Repor</button>
        </div>
      `).join('')}</div>` : `<div class="empty" style="padding:26px 10px;"><div class="big">Tudo certo por aqui</div><div class="faint">Nenhum item abaixo do estoque mínimo.</div></div>`}
    </div>
    <div class="panel">
      <h2 class="section-title">${ICONS.history} Últimas movimentações</h2>
      ${recent.length ? recent.map(m=> renderMovementRow(m)).join('') : `<div class="empty" style="padding:26px 10px;"><div class="big">Nenhuma movimentação ainda</div><div class="faint">Ajustes de estoque aparecerão aqui.</div></div>`}
    </div>
  </div>
  <style>@media(max-width:820px){.painel-grid{grid-template-columns:1fr !important;}}</style>
  `;
}

function renderMovementRow(m){
  const item = STATE.items.find(i=>i.id===m.itemId);
  const nome = item ? item.nome : (m.itemNome || 'Item removido');
  const unidade = item ? item.unidade : (m.unidade||'un');
  return `<div class="movement-row">
    <div class="move-icon ${m.tipo}">${m.tipo==='in'?ICONS.up:ICONS.down}</div>
    <div class="move-body">
      <div class="move-title">${escapeHtml(nome)}</div>
      <div class="move-meta">${escapeHtml(m.motivo)} · ${fmtDate(m.data)}</div>
    </div>
    <div class="move-qty ${m.tipo}">${m.tipo==='in'?'+':'−'}${fmtQty(m.quantidade, unidade)}</div>
  </div>`;
}

/* ---------------- category tab ---------------- */
function renderCategoryTab(cat){
  const all = itemsByCat(cat);
  const list = filterSearch(all);
  const meta = TAB_META[cat];
  const isProduto = cat==='Produto Pronto';

  return `
  <div class="toolbar">
    <div class="search">
      ${ICONS.search}
      <input id="search-input" type="text" placeholder="Buscar em ${meta.label.toLowerCase()}..." value="${escapeAttr(ui.search)}">
    </div>
    <button class="btn primary" id="btn-new-item">${ICONS.plus} Novo item</button>
  </div>
  <div class="panel" style="padding:10px 18px 6px;">
    ${list.length ? `<table>
      <thead><tr>
        <th>Item</th>
        <th class="num">Estoque atual</th>
        <th class="num">Mínimo</th>
        <th class="num">Custo unit.</th>
        ${isProduto? '<th class="num">Preço venda</th>':''}
        <th class="num" style="width:220px;">Ações</th>
      </tr></thead>
      <tbody>
        ${list.map(i=> renderItemRow(i, isProduto)).join('')}
      </tbody>
    </table>` : `<div class="empty">${ICONS.empty}<div class="big">Nenhum item encontrado</div><div class="faint">${ui.search? 'Tente outra busca ou ' : ''}Cadastre um novo item em ${meta.label.toLowerCase()}.</div></div>`}
  </div>`;
}

function renderItemRow(i, isProduto){
  const low = isLow(i);
  return `<tr>
    <td>
      <div class="item-name">${escapeHtml(i.nome)}</div>
      <div class="item-sub">${i.subcategoria? escapeHtml(i.subcategoria)+' · ' : ''}${i.embalagem_qtd? 'pacote de '+fmtQty(i.embalagem_qtd,i.unidade)+' · '+fmtMoney(i.custo_embalagem) : ''}</div>
    </td>
    <td class="num">
      <span class="pill ${low?'low':'ok'}"><span class="pill dot"></span>${fmtQty(i.estoque_atual, i.unidade)}</span>
    </td>
    <td class="num muted">${fmtQty(i.estoque_minimo, i.unidade)}</td>
    <td class="num">${fmtMoney(i.custo_unitario)}</td>
    ${isProduto? `<td class="num">${fmtMoney(i.preco_venda)}</td>` : ''}
    <td class="num">
      <div class="btn-row">
        <button class="btn sm icon" title="Entrada de estoque" data-move-in="${i.id}">${ICONS.up}</button>
        <button class="btn sm icon" title="Saída de estoque" data-move-out="${i.id}">${ICONS.down}</button>
        <button class="btn sm icon ghost" title="Editar" data-edit="${i.id}">${ICONS.edit}</button>
        <button class="btn sm icon ghost danger" title="Excluir" data-delete="${i.id}">${ICONS.trash}</button>
      </div>
    </td>
  </tr>`;
}

/* ---------------- movimentações tab ---------------- */
function renderMovimentacoes(){
  const list = [...STATE.movements].sort((a,b)=> new Date(b.data)-new Date(a.data));
  const filtered = ui.search.trim() ? list.filter(m=>{
    const item = STATE.items.find(i=>i.id===m.itemId);
    const nome = item? item.nome : (m.itemNome||'');
    return nome.toLowerCase().includes(ui.search.toLowerCase()) || m.motivo.toLowerCase().includes(ui.search.toLowerCase());
  }) : list;

  return `
  <div class="toolbar">
    <div class="search">${ICONS.search}<input id="search-input" type="text" placeholder="Buscar movimentações..." value="${escapeAttr(ui.search)}"></div>
  </div>
  <div class="panel">
    ${filtered.length ? filtered.map(m=>renderMovementRow(m)).join('') : `<div class="empty">${ICONS.empty}<div class="big">Nenhuma movimentação</div><div class="faint">Registre entradas e saídas nas abas de estoque.</div></div>`}
  </div>`;
}

/* ---------------- item modal (add/edit) ---------------- */
function openItemModal(id){
  ui.modalItem = id ? {...STATE.items.find(i=>i.id===id)} : {
    id:null, nome:'', categoria: (ui.tab==='painel'||ui.tab==='movimentacoes') ? 'Ingrediente' : ui.tab,
    unidade:'g', embalagem_qtd:'', custo_embalagem:'', custo_unitario:'', preco_venda:'',
    estoque_atual:0, estoque_minimo:0
  };
  render();
}
function closeItemModal(){
  const ov = document.getElementById('item-overlay');
  if(ov) ov.remove();
  ui.modalItem=null;
  render();
}

function renderItemModal(){
  const m = ui.modalItem;
  const isEdit = !!m.id;
  const isProduto = m.categoria==='Produto Pronto';
  const overlay = document.createElement('div');
  overlay.className='overlay'; overlay.id='item-overlay';
  overlay.innerHTML = `
    <div class="modal">
      <h3>${isEdit? 'Editar item' : 'Novo item'}</h3>
      <p class="modal-sub">${isEdit? 'Atualize as informações do item.' : 'Preencha os dados para cadastrar no estoque.'}</p>
      <form id="item-form">
        <div class="field">
          <label>Nome</label>
          <input name="nome" required value="${escapeAttr(m.nome)}" placeholder="Ex: Leite condensado">
        </div>
        <div class="field">
          <label>Categoria</label>
          <select name="categoria">
            <option value="Ingrediente" ${m.categoria==='Ingrediente'?'selected':''}>Ingrediente</option>
            <option value="Embalagem" ${m.categoria==='Embalagem'?'selected':''}>Embalagem</option>
            <option value="Produto Pronto" ${m.categoria==='Produto Pronto'?'selected':''}>Produto Pronto</option>
          </select>
        </div>
        <div class="field-row">
          <div class="field">
            <label>Unidade</label>
            <select name="unidade">
              ${['g','kg','ml','l','un'].map(u=>`<option value="${u}" ${m.unidade===u?'selected':''}>${u}</option>`).join('')}
            </select>
          </div>
          <div class="field">
            <label>Estoque mínimo</label>
            <input name="estoque_minimo" type="number" step="any" min="0" value="${m.estoque_minimo??0}">
          </div>
        </div>
        <div class="field-row" id="pkg-fields" style="${isProduto? 'display:none;':''}">
          <div class="field">
            <label>Qtd. da embalagem</label>
            <input name="embalagem_qtd" type="number" step="any" min="0" value="${m.embalagem_qtd??''}" placeholder="Ex: 1000">
          </div>
          <div class="field">
            <label>Custo da embalagem</label>
            <input name="custo_embalagem" type="number" step="any" min="0" value="${m.custo_embalagem??''}" placeholder="Ex: 49.90">
          </div>
        </div>
        <div class="field">
          <label>Custo por unidade ${isProduto?'':'(calculado automaticamente se preencher acima)'}</label>
          <input name="custo_unitario" type="number" step="any" min="0" value="${m.custo_unitario??''}" placeholder="0,00">
        </div>
        <div class="field" id="preco-venda-field" style="${isProduto? '':'display:none;'}">
          <label>Preço de venda</label>
          <input name="preco_venda" type="number" step="any" min="0" value="${m.preco_venda??''}" placeholder="0,00">
        </div>
        <div class="field">
          <label>Estoque atual</label>
          <input name="estoque_atual" type="number" step="any" min="0" value="${m.estoque_atual??0}">
        </div>
        <div class="modal-actions">
          <button type="button" class="btn ghost" id="item-cancel">Cancelar</button>
          <button type="submit" class="btn primary">${isEdit?'Salvar alterações':'Cadastrar item'}</button>
        </div>
      </form>
    </div>`;
  document.body.appendChild(overlay);

  overlay.addEventListener('mousedown', (e)=>{ if(e.target===overlay) closeItemModal(); });
  overlay.querySelector('#item-cancel').addEventListener('click', closeItemModal);
  const catSelect = overlay.querySelector('select[name="categoria"]');
  catSelect.addEventListener('change', ()=>{
    const isP = catSelect.value==='Produto Pronto';
    overlay.querySelector('#pkg-fields').style.display = isP? 'none':'';
    overlay.querySelector('#preco-venda-field').style.display = isP? '':'none';
  });

  const embQtd = overlay.querySelector('input[name="embalagem_qtd"]');
  const embCusto = overlay.querySelector('input[name="custo_embalagem"]');
  const unitCusto = overlay.querySelector('input[name="custo_unitario"]');
  function recalc(){
    const q = parseFloat(embQtd.value), c = parseFloat(embCusto.value);
    if(q>0 && !isNaN(c)) unitCusto.value = Math.round((c/q)*10000)/10000;
  }
  embQtd.addEventListener('input', recalc);
  embCusto.addEventListener('input', recalc);

  overlay.querySelector('#item-form').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    const data = Object.fromEntries(fd.entries());
    const item = {
      id: m.id || uid(),
      nome: data.nome.trim(),
      categoria: data.categoria,
      unidade: data.unidade,
      embalagem_qtd: data.embalagem_qtd? parseFloat(data.embalagem_qtd): undefined,
      custo_embalagem: data.custo_embalagem? parseFloat(data.custo_embalagem): undefined,
      custo_unitario: data.custo_unitario? parseFloat(data.custo_unitario): 0,
      preco_venda: data.categoria==='Produto Pronto' && data.preco_venda ? parseFloat(data.preco_venda) : undefined,
      subcategoria: m.subcategoria,
      estoque_atual: parseFloat(data.estoque_atual)||0,
      estoque_minimo: parseFloat(data.estoque_minimo)||0
    };
    if(m.id){
      const idx = STATE.items.findIndex(x=>x.id===m.id);
      STATE.items[idx] = item;
      toast('Item atualizado.');
    } else {
      STATE.items.push(item);
      toast('Item cadastrado.');
    }
    await saveState();
    closeItemModal();
  });
}

/* ---------------- move (entrada/saída) modal ---------------- */
function openMoveModal(itemId, tipo){
  ui.modalMove = { itemId, tipo: tipo||'in' };
  render();
}
function closeMoveModal(){
  const ov = document.getElementById('move-overlay');
  if(ov) ov.remove();
  ui.modalMove=null;
  render();
}

const MOTIVOS_IN = ['Compra de insumo','Produção não utilizada','Ajuste de contagem','Outro'];
const MOTIVOS_OUT = ['Uso em receita','Venda','Perda / vencido','Ajuste de contagem','Outro'];

function renderMoveModal(){
  const { itemId, tipo } = ui.modalMove;
  const item = STATE.items.find(i=>i.id===itemId);
  if(!item){ ui.modalMove=null; return; }
  const overlay = document.createElement('div');
  overlay.className='overlay'; overlay.id='move-overlay';
  const motivos = tipo==='in'? MOTIVOS_IN: MOTIVOS_OUT;
  overlay.innerHTML = `
    <div class="modal">
      <h3>${escapeHtml(item.nome)}</h3>
      <p class="modal-sub">Estoque atual: ${fmtQty(item.estoque_atual, item.unidade)} · mínimo ${fmtQty(item.estoque_minimo, item.unidade)}</p>
      <div class="seg" id="tipo-seg">
        <button type="button" data-t="in" class="${tipo==='in'?'active':''}">${ICONS.up} Entrada</button>
        <button type="button" data-t="out" class="${tipo==='out'?'active out':''}">${ICONS.down} Saída</button>
      </div>
      <form id="move-form" style="margin-top:16px;">
        <div class="field">
          <label>Quantidade (${item.unidade})</label>
          <input name="quantidade" type="number" min="0" step="any" required placeholder="0" autofocus>
        </div>
        <div class="field">
          <label>Motivo</label>
          <select name="motivo">${motivos.map(mo=>`<option value="${mo}">${mo}</option>`).join('')}</select>
        </div>
        <div class="field">
          <label>Observação (opcional)</label>
          <input name="obs" placeholder="Ex: pedido da Ana, lote 12...">
        </div>
        <div class="modal-actions">
          <button type="button" class="btn ghost" id="move-cancel">Cancelar</button>
          <button type="submit" class="btn primary" id="move-submit">${tipo==='in'?'Registrar entrada':'Registrar saída'}</button>
        </div>
      </form>
    </div>`;
  document.body.appendChild(overlay);
  let currentTipo = tipo;

  overlay.addEventListener('mousedown', (e)=>{ if(e.target===overlay) closeMoveModal(); });
  overlay.querySelector('#move-cancel').addEventListener('click', closeMoveModal);

  const seg = overlay.querySelector('#tipo-seg');
  const motivoSelect = overlay.querySelector('select[name="motivo"]');
  const submitBtn = overlay.querySelector('#move-submit');
  seg.querySelectorAll('button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      currentTipo = btn.dataset.t;
      seg.querySelectorAll('button').forEach(b=>b.classList.remove('active','out'));
      btn.classList.add('active', currentTipo==='out'?'out':'');
      const list = currentTipo==='in'? MOTIVOS_IN: MOTIVOS_OUT;
      motivoSelect.innerHTML = list.map(mo=>`<option value="${mo}">${mo}</option>`).join('');
      submitBtn.textContent = currentTipo==='in'? 'Registrar entrada':'Registrar saída';
    });
  });

  overlay.querySelector('#move-form').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    const qtd = parseFloat(fd.get('quantidade'));
    if(!qtd || qtd<=0){ toast('Informe uma quantidade válida.'); return; }
    const idx = STATE.items.findIndex(i=>i.id===itemId);
    if(currentTipo==='out' && qtd > STATE.items[idx].estoque_atual){
      const proceed = true; // allow negative-avoidance not blocking, just clamp warn
    }
    if(currentTipo==='in'){
      STATE.items[idx].estoque_atual = Math.round(((Number(STATE.items[idx].estoque_atual)||0) + qtd)*1000)/1000;
    } else {
      STATE.items[idx].estoque_atual = Math.round((Math.max(0,(Number(STATE.items[idx].estoque_atual)||0) - qtd))*1000)/1000;
    }
    STATE.movements.unshift({
      id: uid(), itemId, itemNome: STATE.items[idx].nome, unidade: STATE.items[idx].unidade,
      tipo: currentTipo, quantidade: qtd, motivo: fd.get('motivo') + (fd.get('obs')? ' — '+fd.get('obs'):''),
      data: new Date().toISOString()
    });
    await saveState();
    toast((currentTipo==='in'?'Entrada':'Saída') + ' registrada.');
    closeMoveModal();
  });
}

/* ---------------- delete confirm ---------------- */
function deleteItem(id){
  const item = STATE.items.find(i=>i.id===id);
  if(!item) return;
  if(!confirm(`Excluir "${item.nome}" do estoque? Essa ação não pode ser desfeita.`)) return;
  STATE.items = STATE.items.filter(i=>i.id!==id);
  saveState();
  toast('Item excluído.');
  render();
}

/* ---------------- events ---------------- */
function bindGlobalEvents(){
  document.querySelectorAll('nav.tabs button').forEach(btn=>{
    btn.addEventListener('click', ()=>{ ui.tab = btn.dataset.tab; ui.search=''; render(); });
  });
  const searchInput = document.getElementById('search-input');
  if(searchInput){
    searchInput.addEventListener('input', (e)=>{
      ui.search = e.target.value;
      const content = document.getElementById('tab-content');
      content.innerHTML = renderTabContent();
      bindContentEvents();
      const el = document.getElementById('search-input');
      if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
    });
  }
  bindContentEvents();
}

function bindContentEvents(){
  const btnNew = document.getElementById('btn-new-item');
  if(btnNew) btnNew.addEventListener('click', ()=> openItemModal(null));

  document.querySelectorAll('[data-move-in]').forEach(b=> b.addEventListener('click', ()=> openMoveModal(b.dataset.moveIn,'in')));
  document.querySelectorAll('[data-move-out]').forEach(b=> b.addEventListener('click', ()=> openMoveModal(b.dataset.moveOut,'out')));
  document.querySelectorAll('[data-edit]').forEach(b=> b.addEventListener('click', ()=> openItemModal(b.dataset.edit)));
  document.querySelectorAll('[data-delete]').forEach(b=> b.addEventListener('click', ()=> deleteItem(b.dataset.delete)));
}

/* ---------------- utils ---------------- */
function escapeHtml(s){ return String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s){ return escapeHtml(s); }

/* ---------------- boot ---------------- */
async function boot(){
  document.getElementById('app').innerHTML = `<div style="padding:80px 0; text-align:center; color:#B39C86;">Carregando estoque...</div>`;
  await loadState();
  render();
}
boot();

})();

</script>
</body>
</html>
